name: Mockmate checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DB_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: pip install -r backend/requirements.txt
      - run: npm run test:migrations
      - run: python scripts/init-test-db.py
      - run: python scripts/export-openapi.py && npx openapi-typescript contracts/openapi.json -o src/lib/api/generated.ts
      - run: git diff --exit-code -- contracts/openapi.json src/lib/api/generated.ts
      - run: python -m pytest backend/tests -q
      - run: npm run typecheck && npm run lint
      - name: Install Chromium and system dependencies
        timeout-minutes: 15
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Chromium installation failed after three attempts."
              exit 1
            fi
            echo "Retrying Chromium installation after attempt $attempt."
            sleep $((attempt * 10))
          done
      - run: npm run build && npm run test:e2e
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
      - run: python scripts/browser-test-server.py > /tmp/mockmate-test-service.log 2>&1 &
        env:
          MOCKMATE_TEST_HARNESS: '1'
      - run: npm run build && npm run test:e2e
        env:
          NEXT_PUBLIC_DEMO_MODE: 'false'
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8011
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8011
          MOCKMATE_BROWSER_MODE: live
      - run: python scripts/check-secrets.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-evidence
          path: |
            playwright-report/
            test-results/
